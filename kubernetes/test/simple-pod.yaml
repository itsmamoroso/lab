apiVersion: v1
kind: Pod
metadata:
  name: simplest-pod
  namespace: default
  labels:
    method: copy-from-docs
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
    volumeMounts:
      - mountPath: /scratch
        name: scratch-volume
  volumes:
    - name: scratch-volume
      emptyDir:
        sizeLimit: 500Mi
